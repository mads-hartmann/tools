name: CI

on:
  pull_request:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            # tool-ona-env-port-forward excluded: minttea/riot deps don't build on Linux
            packages: "ona,tool-ona-sync-zed-ssh-connections,tool-ona-log-msg-parser,tool-md-serve"
            opam_files: >-
              ./opam/ona.opam
              ./opam/tool-ona-sync-zed-ssh-connections.opam
              ./opam/tool-ona-log-msg-parser.opam
              ./opam/tool-md-serve.opam
          - os: macos-latest
            platform: macos
            packages: "ona,tool-ona-sync-zed-ssh-connections,tool-ona-log-msg-parser,tool-md-serve,tool-ona-env-port-forward"
            opam_files: >-
              ./opam/ona.opam
              ./opam/tool-ona-sync-zed-ssh-connections.opam
              ./opam/tool-ona-log-msg-parser.opam
              ./opam/tool-md-serve.opam
              ./opam/tool-ona-env-port-forward.opam

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.2"

      - name: Install dependencies
        run: opam install ${{ matrix.opam_files }} --deps-only --with-test -y

      - name: Build
        run: opam exec -- dune build -p ${{ matrix.packages }}

      - name: Test
        run: opam exec -- dune runtest -p ${{ matrix.packages }}

      - name: Collect binaries
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p dist
          for pkg in $(echo "${{ matrix.packages }}" | tr ',' ' '); do
            if [ "$pkg" = "ona" ]; then continue; fi
            binary="./_build/install/default/bin/$pkg"
            if [ -f "$binary" ]; then
              cp "$binary" "dist/${pkg}-${{ matrix.platform }}"
            fi
          done

      - name: Upload binaries
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
